<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allied Opportunities Index Interactive Map</title>
  <!-- Link to the PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <style>
    /* Basic layout styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }
    #map-container {
      flex: 2;
      border-right: 1px solid #ccc;
      overflow: auto;
      position: relative;
    }
    #sidebar {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    #country-info {
      margin-bottom: 20px;
    }
    #supply-chain-section {
      display: none;
    }
    #toggle-sc {
      margin-bottom: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    table th, table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    table th {
      background-color: #f2f2f2;
    }
    /* Highlight map regions on hover */
    svg path:hover {
      fill: #e0e0e0;
    }
  </style>
</head>
<body>

    <!-- Map container; the world SVG will be loaded dynamically via fetch -->
    <div id="map-container">
      <div id="map"></div>
    </div>

  <!-- Sidebar displaying country information and supply chain interface -->
  <div id="sidebar">
    <button id="toggle-sc">Show Supply Chain Panel</button>
    <div id="country-info">
      <h2>Allied Opportunities Index</h2>
      <p>Click a country on the map to view its scores.</p>
    </div>
    <div id="supply-chain-section">
      <h2>Supply Chain Evaluation</h2>
      <p>Enter your supply chain as a list of <code>Country:Spend</code> pairs separated by commas (e.g., <code>Mexico:100, Vietnam:50</code>):</p>
      <input type="text" id="sc-input" style="width:100%;" placeholder="Country:Spend, Country:Spend">
      <button id="evaluate-btn">Evaluate</button>
      <div id="sc-results"></div>
    </div>
  </div>

  <script>
    // Dataset mapping ISO codes to country names and scores. These values
    // correspond to the sample countries used in the AOI MVP.
    const countryScores = {
      'CA': { name: 'Canada', allied: 9.42, economic: 8.12 },
      'MX': { name: 'Mexico', allied: 6.69, economic: 6.26 },
      'VN': { name: 'Vietnam', allied: 5.12, economic: 5.63 },
      'IN': { name: 'India', allied: 5.46, economic: 5.61 },
      'DE': { name: 'Germany', allied: 9.15, economic: 8.49 },
      'CN': { name: 'China', allied: 1.62, economic: 5.25 },
      'RU': { name: 'Russia', allied: 0.62, economic: 2.45 }
    };

    // Maps country names to ISO codes for input parsing. Keys are lowercase.
    const nameToIso = {};
    Object.keys(countryScores).forEach(iso => {
      nameToIso[countryScores[iso].name.toLowerCase()] = iso;
    });

    // Toggle display of the supply chain section
    const toggleButton = document.getElementById('toggle-sc');
    const scSection = document.getElementById('supply-chain-section');
    toggleButton.addEventListener('click', () => {
      if (scSection.style.display === 'none' || scSection.style.display === '') {
        scSection.style.display = 'block';
        toggleButton.textContent = 'Hide Supply Chain Panel';
      } else {
        scSection.style.display = 'none';
        toggleButton.textContent = 'Show Supply Chain Panel';
      }
    });

    // Load the world SVG and attach event listeners. We use fetch to retrieve
    // the file and embed it inline so that we can manipulate its DOM.
    (function loadWorldMap() {
      fetch('world_map.svg')
        .then(response => response.text())
        .then(svgText => {
          // Insert the SVG markup into the map container
          const mapDiv = document.getElementById('map');
          mapDiv.innerHTML = svgText;
          // After insertion, attach event listeners to each path
          const svg = mapDiv.querySelector('svg');
          const paths = svg.querySelectorAll('path');
          paths.forEach(path => {
            const iso = path.getAttribute('id');
            if (!iso) return;
            path.style.cursor = 'pointer';
            path.addEventListener('mouseenter', () => {
              path.dataset.originalFill = path.style.fill;
              path.style.fill = '#e0e0e0';
            });
            path.addEventListener('mouseleave', () => {
              path.style.fill = path.dataset.originalFill || '';
            });
            path.addEventListener('click', () => {
              const infoDiv = document.getElementById('country-info');
              const data = countryScores[iso];
              if (data) {
                infoDiv.innerHTML = `<h2>${data.name}</h2>` +
                  `<p><strong>Allied Score:</strong> ${data.allied.toFixed(2)}</p>` +
                  `<p><strong>Economic Score:</strong> ${data.economic.toFixed(2)}</p>`;
              } else {
                infoDiv.innerHTML = `<h2>${iso}</h2><p>No data available for this country.</p>`;
              }
            });
          });
        })
        .catch(error => {
          console.error('Error loading world_map.svg:', error);
        });
    })();

    // Evaluate supply chain when the user clicks the evaluate button
    document.getElementById('evaluate-btn').addEventListener('click', () => {
      const input = document.getElementById('sc-input').value.trim();
      const resultDiv = document.getElementById('sc-results');
      if (!input) {
        resultDiv.innerHTML = '<p style="color:red;">Please enter at least one Country:Spend pair.</p>';
        return;
      }
      // Parse the input string into an array of {country, spend}
      const items = [];
      const pairs = input.split(',');
      let errors = [];
      pairs.forEach(pair => {
        const parts = pair.split(':');
        if (parts.length !== 2) {
          errors.push(`Invalid format: '${pair.trim()}'. Use Country:Spend.`);
          return;
        }
        const countryStr = parts[0].trim().toLowerCase();
        const spendStr = parts[1].trim();
        let iso = null;
        // Match by name or ISO code
        if (countryScores[countryStr.toUpperCase()]) {
          iso = countryStr.toUpperCase();
        } else if (nameToIso[countryStr]) {
          iso = nameToIso[countryStr];
        }
        if (!iso) {
          errors.push(`Unknown country: '${parts[0].trim()}'`);
          return;
        }
        const spend = parseFloat(spendStr);
        if (isNaN(spend) || spend <= 0) {
          errors.push(`Invalid spend value for ${parts[0].trim()}: '${spendStr}'`);
          return;
        }
        items.push({ iso, country: countryScores[iso].name, spend });
      });
      if (errors.length > 0) {
        resultDiv.innerHTML = '<p style="color:red;">' + errors.join('<br>') + '</p>';
        return;
      }
      // Compute weighted scores
      let totalSpend = 0;
      items.forEach(item => { totalSpend += item.spend; });
      let alliedScore = 0;
      let economicScore = 0;
      items.forEach(item => {
        const share = item.spend / totalSpend;
        const data = countryScores[item.iso];
        if (data) {
          alliedScore += data.allied * share;
          economicScore += data.economic * share;
        }
      });
      // Suggest alternative countries
      const usedIso = items.map(item => item.iso);
      const suggestions = Object.keys(countryScores)
        .filter(iso => !usedIso.includes(iso))
        .map(iso => ({ iso, ...countryScores[iso] }))
        .sort((a, b) => {
          if (b.allied !== a.allied) return b.allied - a.allied;
          return b.economic - a.economic;
        })
        .slice(0, 3);
      // Build the results HTML
      let html = `<p><strong>Weighted Allied Score:</strong> ${alliedScore.toFixed(2)}<br>` +
                 `<strong>Weighted Economic Score:</strong> ${economicScore.toFixed(2)}</p>`;
      if (suggestions.length > 0) {
        html += '<h3>Suggested Alternative Countries</h3><table>' +
          '<tr><th>Country</th><th>Allied Score</th><th>Economic Score</th></tr>';
        suggestions.forEach(s => {
          html += `<tr><td>${s.name}</td><td>${s.allied.toFixed(2)}</td>` +
                  `<td>${s.economic.toFixed(2)}</td></tr>`;
        });
        html += '</table>';
      }
      resultDiv.innerHTML = html;
    });
  </script>

  <!-- Register service worker for PWA functionality -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(function(registration) {
          console.log('ServiceWorker registration successful with scope:', registration.scope);
        })
        .catch(function(err) {
          console.log('ServiceWorker registration failed:', err);
        });
    }
  </script>

</body>
</html>
